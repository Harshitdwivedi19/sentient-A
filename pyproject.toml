[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentient-a"
version = "1.2.0"
description = "Context-aware conversation sentiment analysis for English, Hindi, and Hinglish dialogue."
readme = "README.md"
authors = [
    { name = "Harshit Dwivedi" }
]
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0.0",
    "joblib>=1.3.0",
    "requests>=2.32.3",
    "certifi>=2026.10.19",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
sentient = "sentient.cli:main"

[project.urls]
Homepage = "https://github.com/Harshitdwivedi19/sentient-A"
Repository = "https://github.com/Harshitdwivedi19/sentient-A"
"Bug Tracker" = "https://github.com/Harshitdwivedi19/sentient-A/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentient*", "src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.joblib"]
